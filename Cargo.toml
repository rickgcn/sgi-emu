[workspace]
members = ["crates/se_core", "crates/se_cpu", "crates/se_float"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["rickgcn"]

[workspace.dependencies]
bitflags = "2"
cc = "1"
se_core = { path = "crates/se_core" }
se_float = { path = "crates/se_float" }

[profile.release]
lto = "thin"
