[workspace]
members = ["crates/se_core", "crates/se_device", "crates/se_float", "crates/se_jit", "crates/se_machine", "crates/se_runtime", "crates/se_ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["rickgcn"]

[workspace.dependencies]
cc = "1"
cxx = "1"
cxx-build = "1"
cranelift-codegen = "=0.133.1"
cranelift-frontend = "=0.133.1"
cranelift-jit = "=0.133.1"
cranelift-module = "=0.133.1"
cranelift-native = "=0.133.1"
directories = "6"
postcard = { version = "1", features = ["use-std"] }
qt-build-utils = "0.9"
se_core = { path = "crates/se_core" }
se_device = { path = "crates/se_device" }
se_float = { path = "crates/se_float" }
se_jit = { path = "crates/se_jit" }
se_machine = { path = "crates/se_machine" }
se_runtime = { path = "crates/se_runtime" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
tempfile = "3"
toml = "0.9"
vt100 = "0.16.2"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
