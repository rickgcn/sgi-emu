[workspace]
members = [
    "crates/se_app",
    "crates/se_cli",
    "crates/se_core",
    "crates/se_cpu",
    "crates/se_device",
    "crates/se_float",
    "crates/se_machine",
    "crates/se_runtime",
    "crates/se_ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["rickgcn"]

[workspace.dependencies]
bitflags = "2"
cc = "1"
se_cli = { path = "crates/se_cli" }
se_core = { path = "crates/se_core" }
se_cpu = { path = "crates/se_cpu" }
se_device = { path = "crates/se_device" }
se_float = { path = "crates/se_float" }
se_machine = { path = "crates/se_machine" }
se_runtime = { path = "crates/se_runtime" }
se_ui = { path = "crates/se_ui" }

[profile.release]
lto = "thin"
