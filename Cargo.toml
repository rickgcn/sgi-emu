[workspace]
members = [
    "crates/se_app",
    "crates/se_cli",
    "crates/se_core",
    "crates/se_cpu",
    "crates/se_device",
    "crates/se_float",
    "crates/se_machine",
    "crates/se_runtime",
    "crates/se_ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["rickgcn"]

[workspace.dependencies]
bitflags = "2"
cc = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
cxx = { version = "=1.0.199", features = ["c++17"] }
cxx-build = "=1.0.199"
directories = "6"
qt-build-utils = "=0.10.0"
rustix = { version = "1", features = ["stdio", "termios"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
se_cli = { path = "crates/se_cli" }
se_core = { path = "crates/se_core" }
se_cpu = { path = "crates/se_cpu" }
se_device = { path = "crates/se_device" }
se_float = { path = "crates/se_float" }
se_machine = { path = "crates/se_machine" }
se_runtime = { path = "crates/se_runtime" }
se_ui = { path = "crates/se_ui" }
toml = "1"
vt100 = "=0.16.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
lto = "thin"
