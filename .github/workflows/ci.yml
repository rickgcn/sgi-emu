name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "3rdparty/**"
      - "rust-toolchain.toml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "3rdparty/**"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          qt-host: linux
          qt-arch: linux_gcc_64

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --release --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --release --workspace --all-features --no-deps --locked

  test:
    name: Test (${{ matrix.platform }})
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - platform: Windows x86_64
            runner: windows-2025
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - platform: macOS aarch64
            runner: macos-15
            qt_host: mac
            qt_arch: clang_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          qt-host: ${{ matrix.qt_host }}
          qt-arch: ${{ matrix.qt_arch }}

      - name: Build workspace
        run: cargo build --release --workspace --all-features --locked

      - name: Run tests
        env:
          DYLD_FRAMEWORK_PATH: ${{ env.QT_ROOT_DIR }}/lib
        run: cargo test --release --workspace --all-features --locked
